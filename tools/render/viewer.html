<!doctype html>
<html>
<head><meta charset="utf-8"><title>Hearthmere Review Viewer</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block}</style></head>
<body>
<script type="importmap">
{"imports":{
  "three":"/vendor/three.module.js",
  "three/addons/":"/vendor/addons/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { installAtmosphere, makePostChain } from '/client/src/atmosphere.js';
import { SunRig } from '/client/src/shadows.js';
import { Water } from '/client/src/water.js';

// --- Locked review setup, docs/ART_BIBLE.md §4 -----------------------------
// Time of day is fixed at 09:30 so that every review screenshot across every
// venue and every iteration is directly comparable. Do not parameterise this.
// Read from content/town/hearthmere.json — the ONE authoritative copy. This
// file used to declare its own constants here under a comment citing §4 and
// then never use them, while the lights below carried different values. Dead
// constants that make a file pass inspection are worse than none.
const TOWN = await (await fetch('/content/town/hearthmere.json')).json();
const LIGHTING = TOWN.lighting;
const SUN_ELEV = LIGHTING.sunElevationDeg, SUN_AZI = LIGHTING.sunAzimuthDeg;

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1600), H = +(q.get('h') || 900);

const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;   // Art Bible §5 chain
renderer.toneMappingExposure = LIGHTING.exposure;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// --- Sky, IBL and aerial perspective --------------------------------------
// From client/src/atmosphere.js, driven by `atmosphere` in
// content/town/hearthmere.json. This file used to carry its own gradient dome
// and its own PMREM; town.html and client/src/main.js carried two more, and by
// the time review/reports/ad-town-02.md was written only this one had any
// ambient occlusion at all — and it was neutral grey where Art Bible §1
// requires warm. One module now. See D-049.
//
// The horizon skirt is added to the ground group rather than to the scene: a
// venue viewer SHIFTS the terrain so the venue's site sits under the origin
// (see below), and a skirt left in world coordinates would stitch to the plate
// edge in the wrong place by exactly that shift.
const ENV = installAtmosphere({ renderer, scene, town: TOWN });
const skyMesh = ENV.sky;
const ATMOS = ENV.atmos;
scene.remove(ENV.horizon);

// --- Water ----------------------------------------------------------------
// The SAME module the client and tools/render/town.html run, handed the SAME
// two authored blocks. Before this, viewer.html was the one harness with no
// water code at all: the fountain basin, the horse troughs, the tannery pits
// and the mill race were reviewed as sheets of still green glass with no
// flow, no Fresnel and no specular shoulder, and signed off against a picture
// the game cannot produce. That is precisely the divergence D-009 forbids and
// it is why the fountain's water has been called dry in two passes.
// WATER_PHASE is a fixed number of seconds of flow, so a render diff between
// two iterations shows an intentional change and not a different wave.
const WATER_PHASE = 12.0;
const water = new Water(ATMOS.water, (TOWN.ambient || {}).wind);

// --- Lighting -------------------------------------------------------------
const el = SUN_ELEV * Math.PI/180, az = SUN_AZI * Math.PI/180;

// The sun is `client/src/shadows.js SunRig` — the same cascaded rig, from the
// same authored `lighting.shadows` block, as the client and tools/render/town.html.
//
// What was here was a fourth hand-typed copy of the single-box rig, and it had
// already drifted from the other three: `sc.far = 220`, `left = -45` against
// the client's 200 and 46. A venue signed off in this viewer was signed off
// under shadows the game does not draw. `docs/ARCHITECTURE.md` §5 specified
// cascades; `review/reports/ad-town-04.md` §1 is the picture of what one box
// does to a floor at 2 m. One class now, three renderers, D-009's rule.
//
// The camera is created further down, so the rig is seeded with the review
// camera's own parameters and re-fitted per view in __setView.
const sunRig = new SunRig({
  scene, lighting: LIGHTING,
  camera: new THREE.PerspectiveCamera(45, W/H, 0.1, 2000),
});

// Ambient floor. Art Bible §1: shadows are warm and LIFTED — never crushed,
// never neutral grey. Cast-shadow regions (under eaves, jetties, awnings) see
// no sun at all, so their entire look comes from these three fills. Getting
// this wrong reads either as blue-grey plastic or as black holes in the frame.
//
// Desaturated sky tint, because the PMREM environment already supplies the
// saturated blue; stacking both turns every shadowed facade cyan.
scene.add(new THREE.HemisphereLight(new THREE.Color(LIGHTING.hemisphere.sky),
                                   new THREE.Color(LIGHTING.hemisphere.ground),
                                   LIGHTING.hemisphere.intensity));

// Warm ambient floor so nothing bottoms out to black.
scene.add(new THREE.AmbientLight(new THREE.Color(LIGHTING.ambient.color), LIGHTING.ambient.intensity));

// Warm bounce from the shadow side, standing in for sunlight reflecting off
// the paving and the building opposite.
const bounce = new THREE.DirectionalLight(new THREE.Color(LIGHTING.bounce.color), LIGHTING.bounce.intensity);
bounce.position.set(-Math.cos(el)*Math.sin(az)*30, 8, -Math.cos(el)*Math.cos(az)*30);
scene.add(bounce);

// The anime separation signature (Art Bible §1): a cool rim from behind.
const rim = new THREE.DirectionalLight(new THREE.Color(LIGHTING.rim.color), LIGHTING.rim.intensity);
rim.position.set(-Math.sin(az)*40, 14, -Math.cos(az)*40);
scene.add(rim);

// --- Ground ---------------------------------------------------------------
// The REAL ground: assets/meshes/terrain.gltf, generated from
// content/town/terrain.json. Not a plane, and not a second implementation of
// the height function either — a venue reviewed against a flat plane is
// reviewed against ground that does not exist, which is how v1 signed off
// buildings that turn out to float once the town is assembled.
//
// A venue mesh is authored about its own origin, so the terrain is SHIFTED so
// that the venue's real site sits under the origin: pass `site=x,z` (the
// venue's entry in content/town/hearthmere.json). The vertical shift puts
// site height at y = 0, which is where the venue's floor plate is authored.
const _site = String(q.get('site') || '0,0').split(',').map(Number);
const ground = new THREE.Group();
const _wantsGround = q.get('ground') !== '0' && !String(q.get('asset') || '').endsWith('terrain.gltf');
if (_wantsGround) {
  const T = (await import('/client/src/terrain.js'));
  const gl = new GLTFLoader();
  await new Promise(res => gl.load('/assets/meshes/terrain.gltf', g => {
    g.scene.traverse(o => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = true; } });
    ground.add(g.scene);
    water.harvest(g.scene);
    res();
  }, undefined, () => res()));
  ground.add(ENV.horizon);
  ground.position.set(-_site[0], -T.height(_site[0], _site[1]), -_site[1]);
  scene.add(ground);
}

// --- Scale reference ------------------------------------------------------
// CLAUDE.md requires a 1.75m human reference in review renders. Scale error is
// the most common and most immersion-breaking defect, and it is invisible
// without something known in frame.
function scaleFigure(){
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color:0xB05C3A, roughness:0.85 });
  const mk = (geo,y)=>{ const m=new THREE.Mesh(geo,skin); m.position.y=y; m.castShadow=true; g.add(m); return m; };
  mk(new THREE.CapsuleGeometry(0.17,0.44,4,12), 1.16);        // torso
  mk(new THREE.SphereGeometry(0.115,16,12), 1.62);            // head -> eye height
  mk(new THREE.CapsuleGeometry(0.075,0.62,4,8), 0.47).position.x = -0.10;
  mk(new THREE.CapsuleGeometry(0.075,0.62,4,8), 0.47).position.x =  0.10;
  const la=mk(new THREE.CapsuleGeometry(0.055,0.52,4,8), 1.18); la.position.x=-0.26; la.rotation.z=0.12;
  const ra=mk(new THREE.CapsuleGeometry(0.055,0.52,4,8), 1.18); ra.position.x= 0.26; ra.rotation.z=-0.12;
  return g;
}

// --- Load asset -----------------------------------------------------------
const loader = new GLTFLoader();
const url = q.get('asset');
let bbox = new THREE.Box3(new THREE.Vector3(-1,0,-1), new THREE.Vector3(1,2,1));

// AUTHORING CONVENTION: every venue's principal facade faces -Z (north).
// The player arrives from the north gate (docs/WORLD_BIBLE.md), and the locked
// 09:30 sun at azimuth 125° lights exactly those -Z faces. So the review camera
// lives on the -Z side; viewing from +Z would judge every asset on its
// shadowed back, which is how the first pass got a warm cream wall to read
// blue-grey.
const FRONT = -1;   // facade normal direction along Z

// Distance needed to fit a subject of given width/height in frame.
function fitDist(w, h, fovDeg, aspect, margin = 1.18){
  const vfov = fovDeg * Math.PI / 180;
  const dv = (h * 0.5) / Math.tan(vfov * 0.5);
  const hfov = 2 * Math.atan(Math.tan(vfov * 0.5) * aspect);
  const dh = (w * 0.5) / Math.tan(hfov * 0.5);
  return Math.max(dv, dh) * margin;
}

// Where the player character stands for third-person views: in front of the
// facade, at a natural approach distance.
function playerStand(box){
  const c = box.getCenter(new THREE.Vector3());
  return new THREE.Vector3(c.x, 0, box.min.z - 2.2);
}

function frameFor(view, box){
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3());
  const r = Math.max(s.x, s.y, s.z);
  const stand = playerStand(box);
  const aspect = W / H;
  switch(view){
    // THE view that matters. The game is always default third-person, so this
    // is the camera the player actually has: behind and above the character,
    // pitched down slightly, character in frame at lower centre.
    // Rig: 3.6m back, 2.05m high, aiming past the character's head at the
    // subject. Assets are judged here, not from a hero close-up.
    // Standing at the door. Close third-person — reads the ground-floor
    // detail the player is actually near, at the scale they see it.
    case 'gameplay':
    case 'thirdperson': {
      const height = 2.05;
      return {
        pos:  new THREE.Vector3(stand.x, height, stand.z - 3.6),
        look: new THREE.Vector3(c.x, Math.min(2.2, Math.max(1.3, s.y * 0.42)), c.z),
        fov: 55, player: stand,
      };
    }
    // Third-person from an off-axis angle — checks the asset holds up from the
    // directions players actually orbit to, not just dead-on.
    case 'orbit': {
      const a = Math.PI * 0.30;
      const d = fitDist(Math.max(s.x, s.z) * 1.25, s.y, 55, aspect);
      const px = c.x - Math.sin(a) * d, pz = c.z - Math.cos(a) * d;
      return {
        pos:  new THREE.Vector3(px, Math.max(2.05, s.y * 0.42), pz),
        look: new THREE.Vector3(c.x, s.y * 0.40, c.z),
        fov: 55,
        player: new THREE.Vector3(px + Math.sin(a) * 3.6, 0, pz + Math.cos(a) * 3.6),
      };
    }
    // Approach from down the street — how the venue first reads at distance.
    // Whole silhouette must fit; this is the "does it anchor the block" shot.
    case 'approach': {
      const d = fitDist(s.x * 1.15, s.y * 1.15, 55, aspect) + 2.0;
      return {
        pos:  new THREE.Vector3(c.x + s.x * 0.22, 2.05, c.z - d),
        look: new THREE.Vector3(c.x, s.y * 0.45, c.z),
        fov: 55,
        player: new THREE.Vector3(c.x + s.x * 0.20, 0, c.z - d + 3.6),
      };
    }
    case 'hero': {
      const d = fitDist(s.x, s.y, 45, aspect);
      return { pos:new THREE.Vector3(c.x + d*0.55, s.y*0.72, c.z - d*0.85), look:new THREE.Vector3(c.x, s.y*0.42, c.z), fov:45 };
    }
    case 'front': {
      const d = fitDist(s.x, s.y, 42, aspect);
      return { pos:new THREE.Vector3(c.x, s.y*0.45, c.z - d), look:new THREE.Vector3(c.x, s.y*0.45, c.z), fov:42 };
    }
    case 'side': {
      const d = fitDist(s.z, s.y, 42, aspect);
      return { pos:new THREE.Vector3(c.x + d, s.y*0.45, c.z), look:new THREE.Vector3(c.x, s.y*0.45, c.z), fov:42 };
    }
    // Tight on the entrance — where residue and hero-class detail must hold up.
    case 'detail': return {
      pos:  new THREE.Vector3(c.x + s.x*0.16, 1.55, box.min.z - 2.4),
      look: new THREE.Vector3(c.x, 1.35, box.min.z + 0.3), fov:40,
    };
    case 'silhouette': {
      const d = fitDist(s.x*1.1, s.y*1.1, 42, aspect);
      return { pos:new THREE.Vector3(c.x, s.y*0.45, c.z - d), look:new THREE.Vector3(c.x, s.y*0.45, c.z), fov:42 };
    }
    case 'top':      return { pos:new THREE.Vector3(c.x, s.y + r*1.5, c.z + 0.01), look:c, fov:50 };
    // Explicit camera: `from=x,y,z` and `to=x,y,z` in world metres. The only
    // way to judge a landscape at eye height at a chosen spot — every other
    // view here frames the subject's bounding box, which for terrain means
    // framing the distance ring.
    case 'free': {
      const f = String(q.get('from') || '0,1.62,-20').split(',').map(Number);
      const t = String(q.get('to')   || '0,1.2,0').split(',').map(Number);
      const stand = new THREE.Vector3(f[0], 0, f[2]);
      return { pos:new THREE.Vector3(f[0], f[1], f[2]),
               look:new THREE.Vector3(t[0], t[1], t[2]),
               fov:+(q.get('fov') || 55), player: q.get('figureAt') ? stand : null };
    }
    // Aerial oblique. The only view that can judge a LANDSCAPE — terrain,
    // drainage, how the terraces step down to the water. A ground-level camera
    // cannot see a 4 m fall across 190 m; it reads as level from every eye
    // height in the town, which is exactly why v1's flat plane survived.
    case 'aerial': {
      const d = Math.max(s.x, s.z);
      return { pos:new THREE.Vector3(c.x + d*0.42, c.y + d*0.52, c.z - d*0.80),
               look:new THREE.Vector3(c.x, c.y - d*0.02, c.z), fov:48 };
    }
    // Low aerial from the north, over the water, looking back at the town —
    // the departure/return frame, and the one that shows the fall in profile.
    case 'waterside': {
      const d = Math.max(s.x, s.z);
      return { pos:new THREE.Vector3(c.x + d*0.10, c.y + d*0.13, c.z - d*0.72),
               look:new THREE.Vector3(c.x, c.y + d*0.01, c.z + d*0.10), fov:52 };
    }
    default: {
      const d = fitDist(s.x, s.y, 45, aspect);
      return { pos:new THREE.Vector3(c.x + d*0.5, s.y*0.8, c.z - d*0.8), look:new THREE.Vector3(c.x, s.y*0.4, c.z), fov:45 };
    }
  }
}

// Far plane at 2000 m to match tools/render/town.html and the client: the
// horizon skirt reaches 1200 m and a 1000 m far plane clipped it away.
const camera = new THREE.PerspectiveCamera(45, W/H, 0.1, 2000);

// --- Post chain, docs/ARCHITECTURE.md §5 order ----------------------------
// SSAO -> bloom -> ACES -> grade -> vignette, from the shared module. What was
// here was three's SSAOPass with a 0.35 m kernel and NEUTRAL occlusion; §5's
// grade did not exist at all, so a venue signed off in this viewer was signed
// off against a picture the town render could not reproduce.
const post = makePostChain({
  renderer, scene, camera, width: W, height: H, atmos: ATMOS,
  ao: q.get('ssao') !== '0',
});
const composer = post.composer;

let playerFig = null, refFig = null;

window.__setView = (view, silhouette) => {
  const f = frameFor(view, bbox);
  camera.fov = f.fov; camera.position.copy(f.pos); camera.lookAt(f.look);
  camera.updateProjectionMatrix();

  // The 1.75m figure IS the player character in third-person views, so it must
  // sit on the camera's axis rather than off to one side. Anywhere else and
  // the shot stops being the view the player actually has.
  if (playerFig){
    if (f.player){
      playerFig.visible = true;
      playerFig.position.copy(f.player);
      // Second reference standing AT the facade. The on-axis figure sits 3.6m
      // from the lens and is cropped by the frame bottom in every approach and
      // gameplay shot, so Art Bible §8's "verified with a 1.75m reference" box
      // could not be ticked from any submitted render.
      if (refFig){
        refFig.visible = true;
        const s = bbox.getSize(new THREE.Vector3());
        refFig.position.set(bbox.max.x + 0.9, 0, bbox.min.z - 0.6);
        refFig.rotation.y = Math.PI;
      }
      // Face the way the camera is looking, so we see the character's back.
      const away = new THREE.Vector3(f.look.x - f.player.x, 0, f.look.z - f.player.z);
      if (away.lengthSq() > 1e-6) playerFig.rotation.y = Math.atan2(away.x, away.z);
    } else {
      if (refFig) refFig.visible = false;
      // Non-gameplay views keep the reference beside the asset for scale.
      playerFig.visible = !silhouette;
      playerFig.position.set(bbox.max.x + 0.75, 0, bbox.max.z + 0.35);
      playerFig.rotation.y = 0;
    }
  }
  // The cascades, fitted to the review camera by the same code the client runs
  // per frame. A venue viewer's cameras ARE perspective eye-level cameras, so
  // `fitCascades` is the right mode for all of them; the silhouette overrides
  // every material to flat black and does not care either way.
  sunRig.fitCascades(camera);
  // The ground plane and sky must be EXCLUDED from the black override, or the
  // silhouette is ~46% solid black ground and everything below eaves level is
  // swallowed — which makes the Art Bible §6 black-on-white test impossible to
  // run, the exact thing the view exists for.
  scene.overrideMaterial = silhouette
    ? new THREE.MeshBasicMaterial({ color:0x000000 }) : null;
  if (silhouette) {
    scene.background = new THREE.Color(0xffffff);
    ground.visible = false;
    skyMesh.visible = false;
    // Haze would grey the far edge of the subject toward the background and
    // destroy the separation a black-on-white elevation exists to measure.
    scene.fog = null;
    post.setAO(false);
    post.grade.enabled = false;
  } else {
    scene.background = null;
    ground.visible = _wantsGround;
    skyMesh.visible = true;
    scene.fog = ENV.fog;
    post.setAO(q.get('ssao') !== '0');
    post.grade.enabled = true;
  }
  composer.render();
};

function finish(){
  if (q.get('figure') !== '0'){
    playerFig = scaleFigure();
    scene.add(playerFig);
    refFig = scaleFigure();
    refFig.visible = false;
    scene.add(refFig);
  }
  // Everything sun-lit — ground, horizon skirt, both reference figures and
  // whatever the venue brought. An unregistered material renders at `cascades`x
  // the sun, which in a venue viewer is a blown white asset and no clue why.
  sunRig.register(scene);
  window.__shadows = () => sunRig.stats();
  window.__setView(q.get('view') || 'gameplay', false);
  water.setTime(WATER_PHASE);
  window.__ready = true;
}

if (url){
  loader.load(url, (g) => {
    g.scene.traverse(o => {
      if (o.isMesh){
        o.castShadow = true; o.receiveShadow = true;
        if (o.material){ o.material.envMapIntensity = 1.0; }
      }
    });
    scene.add(g.scene);
    water.harvest(g.scene);
    water.setTime(WATER_PHASE);
    sunRig.register(g.scene);
    bbox = new THREE.Box3().setFromObject(g.scene);
    // `box=x0,y0,z0,x1,y1,z1` overrides the framing volume. Needed for the
    // terrain, whose bounds are the 576 m distance ring: framed on that, every
    // view is a satellite photo and the town is nine pixels wide. The subject
    // of a terrain review is the town footprint, not the extent of the mesh.
    const bq = q.get('box');
    if (bq) {
      const b = bq.split(',').map(Number);
      bbox = new THREE.Box3(new THREE.Vector3(b[0], b[1], b[2]), new THREE.Vector3(b[3], b[4], b[5]));
    }
    finish();
  }, undefined, (e) => { window.__error = String(e); window.__ready = true; });
} else {
  finish();
}
</script>
</body>
</html>
